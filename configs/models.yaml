# Model pretrained yang dipakai (spesifikasi Fase 2 §5A: nama, versi, sumber).
# Sumber unduhan: https://huggingface.co/openai/whisper-<ukuran>  (lisensi Apache-2.0)
# `revision` adalah commit di Hugging Face Hub, dikunci agar hasil bisa diulang.
#
# Unduh semua:  python scripts/download_models.py

models:
  openai/whisper-tiny:
    revision: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
    parameters: 39M
  openai/whisper-base:
    revision: e37978b90ca9030d5170a5c07aadb050351a65bb
    parameters: 74M
  openai/whisper-small:
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
    parameters: 244M
