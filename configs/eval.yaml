# Konfigurasi evaluasi WER dan CER untuk ASR Bahasa Jawa
# Sesuai SPEC.md bagian 5C
#
# Jalankan pada satu file prediksi:
#   python src/evaluate.py --pred results/predictions_fold1_pretrained.csv --tag pretrained
#
# Jalankan agregasi lintas fold:
#   python src/evaluate.py --pred-glob "results/predictions_fold*_pretrained.csv" --tag pretrained

evaluation:
  ref_column: ref_norm
  hyp_column: pred_norm
  fallback_ref_column: ref_raw
  fallback_hyp_column: pred_raw
  group_by:
    - speaker
    - dialect
    - speaker_status
    - group
  num_examples: 10
  output_dir: results
