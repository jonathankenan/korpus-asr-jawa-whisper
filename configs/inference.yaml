# Konfigurasi inferensi dan decoding Whisper (spesifikasi Fase 2 §5A)
#
#   python src/infer.py --exp small-pretrained --model openai/whisper-small --fold all
#   python src/infer.py --audio path/to/audio.wav

model:
  model_name_or_path: openai/whisper-small
  language: javanese
  task: transcribe
  device: auto                 # auto | cuda | cpu

decoding:
  num_beams: 1                 # greedy; beam search 5 diuji sebagai variasi (tiny-pretrained-beam5)
  max_new_tokens: 225
  no_repeat_ngram_size: 3

audio:
  sample_rate: 16000
  chunk_length_sec: 30.0       # audio lebih panjang dipotong berurutan
  peak_dbfs: -3.0              # normalisasi puncak di memori; null = tanpa normalisasi

data:
  batch_size: 8

output:
  predictions_dir: results/predictions
