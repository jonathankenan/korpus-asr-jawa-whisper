# Konfigurasi default fine-tuning Whisper (spesifikasi Fase 2 §5A)
# Skenario eksperimen yang menimpa nilai-nilai ini ada di configs/experiments.yaml.
#
#   python src/train.py --exp small-ft --fold 1

model:
  pretrained_name: openai/whisper-small
  language: javanese
  task: transcribe
  freeze_encoder: false          # true = hanya decoder yang dilatih

data:
  text_column: text_norm
  sample_rate: 16000
  peak_dbfs: -3.0                # normalisasi puncak di memori; null = tanpa normalisasi
  max_duration_sec: 30.0         # filter hanya untuk train dan validation
  min_duration_sec: 0.3

training:
  models_dir: models
  records_dir: results/training
  num_train_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  fp16: true                     # otomatis nonaktif di CPU
  gradient_checkpointing: true   # otomatis nonaktif di CPU atau saat encoder beku
  dataloader_num_workers: 2      # otomatis 0 di CPU
  logging_steps: 25
  generation_max_length: 225
  generation_no_repeat_ngram_size: 3   # sama dengan inferensi
  seed: 42
