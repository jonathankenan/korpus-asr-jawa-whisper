# Konfigurasi pelatihan / fine-tuning Whisper untuk ASR Bahasa Jawa
# Sesuai SPEC.md bagian 5A & 5B
#
# Jalankan:
#   python src/train.py --config configs/train.yaml --fold 1

model:
  pretrained_name: openai/whisper-small   # pilihan: tiny, base, small, medium
  language: javanese                      # kode bahasa target Whisper
  task: transcribe
  freeze_feature_encoder: false

data:
  manifest_path: data/manifest_normalized.csv
  fallback_manifest: data/manifest.csv
  splits_dir: data/splits
  processed_audio_dir: processed_audio    # opsional: gunakan jika sudah dipreprocess
  text_column: text_norm
  sample_rate: 16000
  max_duration_sec: 30.0
  min_duration_sec: 0.3

training:
  output_dir: models/whisper-jv
  num_train_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  fp16: true                              # otomatis nonaktif di CPU
  gradient_checkpointing: true
  eval_strategy: epoch
  save_strategy: epoch
  logging_steps: 25
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false
  generation_max_length: 225
  seed: 42

# Variasi eksperimen yang disarankan (SPEC.md 5B)
experiment_variants:
  models:
    - openai/whisper-tiny
    - openai/whisper-base
    - openai/whisper-small
    - openai/whisper-medium
  learning_rates:
    - 5.0e-6
    - 1.0e-5
    - 3.0e-5
  batch_sizes:
    - 4
    - 8
    - 16
